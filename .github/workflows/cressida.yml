
name: Build Cressida

on:
  push:
    branches: [ main ]
    paths:
      - flake.lock
      - flake.nix
      - .github/workflows/cressida.yml

  workflow_dispatch:

concurrency:
  group: cressida
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Cressida (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure Cachix
        uses: cachix/cachix-action@v15
        with:
          name: cressida
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build Cressida
        run: nix build .#cressida --print-build-logs
