name: Cressida

on:
  push:
    branches: [ main ]
    paths:
      - flake.lock

  workflow_dispatch:

concurrency:
  group: cressida
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Cressida (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check whether Cressida changed
        id: check
        run: |
          OLD_REV=$(git show HEAD^:flake.lock 2>/dev/null | jq -r '.nodes.cressida.locked.rev // empty' || true)
          NEW_REV=$(jq -r '.nodes.cressida.locked.rev')

          if [ "$OLD_REV" != "$NEW_REV" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.changed == 'true'
        uses: cachix/install-nix-action@v31

      - name: Configure Cachix
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.changed == 'true'
        uses: cachix/cachix-action@v15
        with:
          name: cressida
          authToken: '${{ secrets.CRESSIDA_AUTH_TOKEN }}'

      - name: Build Cressida
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.changed == 'true'
        run: nix build .#cressida --print-build-logs
