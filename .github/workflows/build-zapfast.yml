name: Build and Cache Packages

on:
  workflow_dispatch:
  push:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "modules/packages/**"
      - ".github/workflows/build-and-cache.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v16
        with:
          name: icyatnix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and cache selected packages
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t wanted < <(jq -r '.[]' modules/packages/remote-builds.json)

          packages=$(nix eval --json \
            '.#nixosConfigurations.nix.config.environment.systemPackages' \
            --apply '
              xs:
                builtins.map
                  (x: { name = x.name or ""; drvPath = x.drvPath; })
                  (builtins.filter
                    (x: builtins.elem (x.name or "") [
                      "zapfast-0.19.0"
                      "serein-0.1.0"
                    ])
                    xs)
            ')

          for name in "${wanted[@]}"; do
            drv=$(echo "$packages" | jq -er \
              --arg name "$name" \
              '.[] | select(.name == $name) | .drvPath') || {
                echo "ERROR: Package '$name' was not found in systemPackages."
                exit 1
              }

            echo "Building or substituting $name ($drv)"
            mapfile -t outputs < <(nix-store --realise "$drv")

            for out in "${outputs[@]}"; do
              mapfile -t closure < <(nix-store -qR "$out")
              cachix push icyatnix "${closure[@]}"
            done
          done
