
name: Build Rust Apps

on:
  workflow_dispatch:
  push:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "modules/packages/**"
      - ".github/workflows/build-zapfast.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v16
        with:
          name: icyatnix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ZapFast and Serein
        shell: bash
        run: |
          set -euo pipefail

          packages=$(nix eval --json \
            '.#nixosConfigurations.nix.config.environment.systemPackages' \
            --apply '
              xs:
                builtins.map
                  (x: { name = x.name or ""; drvPath = x.drvPath; })
                  (builtins.filter
                    (x: builtins.elem (x.name or "") [
                      "zapfast-0.19.0"
                      "serein-0.1.0"
                    ])
                    xs)
            ')

          echo "$packages" | jq .

          count=$(echo "$packages" | jq 'length')
          if [ "$count" -ne 2 ]; then
            echo "Expected exactly two packages, found $count"
            exit 1
          fi

          while IFS= read -r drv; do
            nix build --no-link "$drv"
          done < <(echo "$packages" | jq -r '.[].drvPath')

