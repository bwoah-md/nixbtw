name: ZapFast

on:
  push:
    branches: [ main ]
    paths:
      - flake.lock

  workflow_dispatch:

concurrency:
  group: zapfast
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ZapFast (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check whether ZapFast changed
        id: check
        run: |
          OLD_REV=$(git show HEAD^:flake.lock 2>/dev/null | jq -r '.nodes.zapfast.locked.rev // empty' || true)
          NEW_REV=$(jq -r '.nodes.zapfast.locked.rev // empty' flake.lock)

          if [ -z "$NEW_REV" ]; then
            echo "ZapFast revision not found in flake.lock"
            exit 1
          fi

          if [ "$OLD_REV" != "$NEW_REV" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ZapFast revision changed: $OLD_REV -> $NEW_REV"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ZapFast revision unchanged: $NEW_REV"
          fi

      - name: Install Nix
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.changed == 'true'
        uses: cachix/install-nix-action@v31

      - name: Configure Cachix
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.changed == 'true'
        uses: cachix/cachix-action@v15
        with:
          name: zapfast
          authToken: '${{ secrets.ZAPFAST_AUTH_TOKEN }}'

      - name: Build ZapFast
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.changed == 'true'
        run: |
          REV=$(jq -er '.nodes.zapfast.locked.rev' flake.lock)
          nix build --no-link -L \
            "github:crmne/zapfast/$REV#packages.x86_64-linux.default"
