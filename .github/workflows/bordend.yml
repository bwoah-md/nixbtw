name: Bordend

on:
  push:
    branches: [main]
    paths:
      - flake.lock

  workflow_dispatch:

concurrency:
  group: bordend
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Bordend (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check whether Bordend or nixpkgs changed
        id: check
        shell: bash
        run: |
          OLD_BORDEND_REV=$(git show HEAD^:flake.lock 2>/dev/null | jq -r '.nodes.bordend.locked.rev // empty' || true)
          NEW_BORDEND_REV=$(jq -r '.nodes.bordend.locked.rev // empty' flake.lock)

          OLD_NIXPKGS_REV=$(git show HEAD^:flake.lock 2>/dev/null | jq -r '.nodes.nixpkgs.locked.rev // empty' || true)
          NEW_NIXPKGS_REV=$(jq -r '.nodes.nixpkgs.locked.rev // empty' flake.lock)

          if [ "$OLD_BORDEND_REV" != "$NEW_BORDEND_REV" ] || [ "$OLD_NIXPKGS_REV" != "$NEW_NIXPKGS_REV" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.changed == 'true'
        uses: cachix/install-nix-action@v31

      - name: Configure Cachix
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.changed == 'true'
        uses: cachix/cachix-action@v17
        with:
          name: bordend
          authToken: '${{ secrets.BORDEND_AUTH_TOKEN }}'

      - name: Build Bordend
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.changed == 'true'
        run: nix build .#bordend --print-build-logs
