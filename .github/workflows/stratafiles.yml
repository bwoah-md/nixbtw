name: stratafiles

on:
  workflow_dispatch:

env:
  STRATA_REF: 9fb7a36ad4352337f3ada0d43710dc6d4ae838b9

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: stratafiles
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build Strata
        run: nix build "github:lgse/strata/${STRATA_REF}" -L
