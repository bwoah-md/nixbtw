name: Rayburst

on:
  push:
    branches: [ main ]
    paths:
      - flake.lock

  workflow_dispatch:

concurrency:
  group: rayburst
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Rayburst (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: rayburst
          authToken: '${{ secrets.RAYBURST_AUTH_TOKEN }}'

      - name: Build Rayburst from source
        run: nix build --no-link -L .#rayburst
