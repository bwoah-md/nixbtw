name: Strata

on:
  push:
    branches: [ main ]
    paths:
      - flake.lock
      - flake.nix
      - .github/workflows/strata.yml

  workflow_dispatch:

concurrency:
  group: stratafiles
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Strata (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: stratafiles
          authToken: '${{ secrets.STRATA_AUTH_TOKEN }}'

      - name: Build Strata
        run: |
          REV=$(jq -er '.nodes.strata.locked.rev' flake.lock)
          nix build --no-link -L "github:lgse/strata/$REV"
