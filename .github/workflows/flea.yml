name: Flea

on:
  push:
    branches: [ main ]
    paths:
      - flake.lock

  workflow_dispatch:

concurrency:
  group: flea
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Flea (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: flea
          authToken: '${{ secrets.FLEA_AUTH_TOKEN }}'

      - name: Build Flea
        run: nix build --no-link -L .#flea
