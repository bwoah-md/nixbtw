name: Luciole

on:
  workflow_dispatch:

concurrency:
  group: luciole
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Luciole (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Configure Cachix
        uses: cachix/cachix-action@v15
        with:
          name: luciole
          authToken: '${{ secrets.LUCIOLE_AUTH_TOKEN }}'

      - name: Build Luciole
        run: nix build .#luciole --print-build-logs
